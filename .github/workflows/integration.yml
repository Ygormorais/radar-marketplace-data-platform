name: Spark integration

on:
  pull_request:
    paths:
      - "src/radar/bronze/**"
      - "src/radar/generators/spark_events.py"
      - "src/radar/silver/**"
      - "src/radar/quality/**"
      - "tests/integration/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spark-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,spark]"
      - run: >-
          python -m pytest -m integration -v
          --cov=radar.bronze
          --cov=radar.generators.spark_events
          --cov=radar.observability.audit
          --cov=radar.silver
          --cov=radar.quality
          --cov-config=config/coverage-spark.toml
          --cov-report=term-missing
