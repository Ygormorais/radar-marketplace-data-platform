name: Fabric deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente GitHub/Fabric de destino
        required: true
        type: choice
        options: [dev, test, prod]
      dry_run:
        description: Somente compilar e validar definições
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: fabric-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - name: Compilar definições Fabric
        run: >-
          python scripts/deploy_fabric.py
          --workspace-id "${{ vars.FABRIC_WORKSPACE_ID }}"
          --dry-run
      - name: Autenticar no Azure com OIDC
        if: ${{ inputs.dry_run == false }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Criar ou atualizar itens Fabric
        if: ${{ inputs.dry_run == false }}
        env:
          FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
          FABRIC_POWERBI_CONNECTION_ID: ${{ vars.FABRIC_POWERBI_CONNECTION_ID }}
        run: |
          FABRIC_TOKEN="$(az account get-access-token --resource https://api.fabric.microsoft.com --query accessToken -o tsv)"
          export FABRIC_TOKEN
          python scripts/deploy_fabric.py
