<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Radar — prévia da visão executiva</title>
  <desc id="desc">Dashboard executivo de e-commerce com KPIs, tendência de GMV, ranking de sellers, risco logístico e conversão por canal. Os valores são ilustrativos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0c1b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24d3b5"/>
      <stop offset="1" stop-color="#25a6f7"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24d3b5" stop-opacity=".34"/>
      <stop offset="1" stop-color="#24d3b5" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
    <style>
      .panel{fill:#10243a;stroke:#223b55;stroke-width:1}.eyebrow{font:600 12px 'Segoe UI',Arial;letter-spacing:1.8px;fill:#62e4cf}.title{font:700 30px 'Segoe UI',Arial;fill:#f4f8fc}.sub{font:400 13px 'Segoe UI',Arial;fill:#8ca4bb}.label{font:600 12px 'Segoe UI',Arial;fill:#8ca4bb}.value{font:700 25px 'Segoe UI',Arial;fill:#f4f8fc}.small{font:400 11px 'Segoe UI',Arial;fill:#758fa8}.positive{font:600 11px 'Segoe UI',Arial;fill:#62e4cf}.negative{font:600 11px 'Segoe UI',Arial;fill:#ff7890}.chartTitle{font:600 15px 'Segoe UI',Arial;fill:#eaf2f9}.axis{stroke:#2a435c;stroke-width:1}.tick{font:400 10px 'Segoe UI',Arial;fill:#718aa2}.legend{font:500 10px 'Segoe UI',Arial;fill:#93a9bc}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1300" cy="-80" r="330" fill="#25a6f7" opacity=".06"/>
  <circle cx="-70" cy="810" r="270" fill="#24d3b5" opacity=".05"/>

  <g transform="translate(48 34)">
    <rect x="0" y="0" width="8" height="50" rx="4" fill="url(#accent)"/>
    <text x="24" y="16" class="eyebrow">RADAR / MARKETPLACE DATA PLATFORM</text>
    <text x="24" y="48" class="title">Visão executiva</text>
    <text x="1010" y="24" class="sub">Período: 01/01/2018 — 31/12/2018</text>
    <rect x="1196" y="0" width="148" height="34" rx="17" fill="#14304a" stroke="#28506d"/>
    <circle cx="1216" cy="17" r="5" fill="#62e4cf"/>
    <text x="1230" y="21" class="label">Direct Lake</text>
  </g>

  <g transform="translate(48 112)" filter="url(#shadow)">
    <g><rect class="panel" width="248" height="112" rx="13"/><text x="20" y="28" class="label">GMV</text><text x="20" y="67" class="value">R$ 16,4 mi</text><text x="20" y="93" class="positive">▲ 12,8% vs. período anterior</text><path d="M179 79 C193 62 204 72 218 50 C226 40 235 45 242 32" fill="none" stroke="#24d3b5" stroke-width="3"/></g>
    <g transform="translate(268)"><rect class="panel" width="248" height="112" rx="13"/><text x="20" y="28" class="label">PEDIDOS</text><text x="20" y="67" class="value">98.742</text><text x="20" y="93" class="positive">▲ 8,3% crescimento</text><circle cx="211" cy="58" r="24" fill="none" stroke="#223b55" stroke-width="7"/><path d="M211 34 A24 24 0 1 1 190 70" fill="none" stroke="#25a6f7" stroke-width="7" stroke-linecap="round"/></g>
    <g transform="translate(536)"><rect class="panel" width="248" height="112" rx="13"/><text x="20" y="28" class="label">TICKET MÉDIO</text><text x="20" y="67" class="value">R$ 166,08</text><text x="20" y="93" class="positive">▲ 4,1% eficiência comercial</text><rect x="192" y="36" width="39" height="39" rx="10" fill="#153d51"/><text x="204" y="63" font-family="Segoe UI" font-size="22" fill="#62e4cf">↗</text></g>
    <g transform="translate(804)"><rect class="panel" width="248" height="112" rx="13"/><text x="20" y="28" class="label">ENTREGA NO PRAZO</text><text x="20" y="67" class="value">87,6%</text><text x="20" y="93" class="negative">▼ 1,9 p.p. sob a meta</text><rect x="195" y="35" width="36" height="45" rx="7" fill="#14304a"/><path d="M202 49h22M202 59h16M202 69h19" stroke="#ffbd66" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(1072)"><rect class="panel" width="272" height="112" rx="13"/><text x="20" y="28" class="label">AVALIAÇÃO MÉDIA</text><text x="20" y="67" class="value">4,18 / 5</text><text x="20" y="93" class="positive">▲ 0,12 satisfação</text><text x="176" y="66" font-family="Segoe UI" font-size="22" fill="#ffd166">★★★★</text><text x="244" y="66" font-family="Segoe UI" font-size="22" fill="#41576c">★</text></g>
  </g>

