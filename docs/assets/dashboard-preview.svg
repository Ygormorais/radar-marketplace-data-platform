      <text x="-42" y="4" class="tick">2,0 mi</text><text x="-42" y="52" class="tick">1,5 mi</text><text x="-42" y="100" class="tick">1,0 mi</text><text x="-42" y="148" class="tick">0,5 mi</text>
      <path d="M0 170 L70 154 L140 163 L210 127 L280 137 L350 105 L420 114 L490 76 L560 85 L630 47 L700 61 L770 20 L770 192 L0 192Z" fill="url(#area)"/>
      <path d="M0 170 L70 154 L140 163 L210 127 L280 137 L350 105 L420 114 L490 76 L560 85 L630 47 L700 61 L770 20" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linejoin="round"/>
      <g fill="#2dd4bf" stroke="#10243a" stroke-width="3"><circle cx="0" cy="170" r="5"/><circle cx="70" cy="154" r="5"/><circle cx="140" cy="163" r="5"/><circle cx="210" cy="127" r="5"/><circle cx="280" cy="137" r="5"/><circle cx="350" cy="105" r="5"/><circle cx="420" cy="114" r="5"/><circle cx="490" cy="76" r="5"/><circle cx="560" cy="85" r="5"/><circle cx="630" cy="47" r="5"/><circle cx="700" cy="61" r="5"/><circle cx="770" cy="20" r="5"/></g>
      <g class="tick"><text x="-8" y="217">JAN</text><text x="132" y="217">MAR</text><text x="272" y="217">MAI</text><text x="412" y="217">JUL</text><text x="552" y="217">SET</text><text x="692" y="217">NOV</text><text x="755" y="217">DEZ</text></g>
    </g>
  </g>

  <g transform="translate(926 248)" filter="url(#shadow)">
    <rect class="panel" width="466" height="284" rx="13"/>
    <text x="22" y="31" class="chartTitle">Ranking de sellers por GMV</text><text x="382" y="31" class="small">TOP 5</text>
    <g transform="translate(22 58)">
      <g class="label"><text y="22">Seller 8f2a…</text><text y="65">Seller 31bd…</text><text y="108">Seller d94e…</text><text y="151">Seller a17c…</text><text y="194">Seller 02be…</text></g>
      <g transform="translate(104)"><rect y="7" width="313" height="18" rx="9" fill="#1a3951"/><rect y="7" width="313" height="18" rx="9" fill="#25a6f7"/><rect y="50" width="313" height="18" rx="9" fill="#1a3951"/><rect y="50" width="269" height="18" rx="9" fill="#25a6f7"/><rect y="93" width="313" height="18" rx="9" fill="#1a3951"/><rect y="93" width="223" height="18" rx="9" fill="#25a6f7"/><rect y="136" width="313" height="18" rx="9" fill="#1a3951"/><rect y="136" width="188" height="18" rx="9" fill="#25a6f7"/><rect y="179" width="313" height="18" rx="9" fill="#1a3951"/><rect y="179" width="154" height="18" rx="9" fill="#25a6f7"/></g>
    </g>
  </g>

  <g transform="translate(48 554)" filter="url(#shadow)">
    <rect class="panel" width="658" height="298" rx="13"/>
    <text x="22" y="31" class="chartTitle">Risco logístico por UF</text><circle cx="469" cy="27" r="5" fill="#ffbd66"/><text x="480" y="31" class="legend">Em risco</text><circle cx="552" cy="27" r="5" fill="#ff657d"/><text x="563" y="31" class="legend">Atrasados</text>
    <g transform="translate(52 63)">
      <path class="axis" d="M0 0V184H566"/>
      <path class="axis" d="M0 46H566M0 92H566M0 138H566" opacity=".55"/>
      <g fill="#ffbd66"><rect x="28" y="52" width="25" height="132" rx="4"/><rect x="132" y="76" width="25" height="108" rx="4"/><rect x="236" y="97" width="25" height="87" rx="4"/><rect x="340" y="120" width="25" height="64" rx="4"/><rect x="444" y="138" width="25" height="46" rx="4"/></g>
      <g fill="#ff657d"><rect x="58" y="84" width="25" height="100" rx="4"/><rect x="162" y="103" width="25" height="81" rx="4"/><rect x="266" y="119" width="25" height="65" rx="4"/><rect x="370" y="137" width="25" height="47" rx="4"/><rect x="474" y="150" width="25" height="34" rx="4"/></g>
      <g class="tick"><text x="43" y="207">SP</text><text x="147" y="207">RJ</text><text x="251" y="207">MG</text><text x="355" y="207">BA</text><text x="459" y="207">PR</text></g>
    </g>
  </g>

  <g transform="translate(726 554)" filter="url(#shadow)">
