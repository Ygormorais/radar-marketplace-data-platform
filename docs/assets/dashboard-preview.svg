    <text x="22" y="31" class="chartTitle">Conversão por origem de tráfego</text><text x="539" y="31" class="small">SESSÃO → COMPRA</text>
    <g transform="translate(52 62)">
      <path class="axis" d="M0 0V184H574"/>
      <path class="axis" d="M0 46H574M0 92H574M0 138H574" opacity=".55"/>
      <g fill="url(#accent)"><rect x="31" y="31" width="58" height="153" rx="7"/><rect x="145" y="57" width="58" height="127" rx="7"/><rect x="259" y="80" width="58" height="104" rx="7"/><rect x="373" y="107" width="58" height="77" rx="7"/><rect x="487" y="127" width="58" height="57" rx="7"/></g>
      <g class="positive"><text x="42" y="22">5,9%</text><text x="156" y="48">4,9%</text><text x="270" y="71">4,0%</text><text x="384" y="98">3,0%</text><text x="498" y="118">2,2%</text></g>
      <g class="tick"><text x="38" y="207">Direto</text><text x="148" y="207">Busca</text><text x="261" y="207">E-mail</text><text x="364" y="207">Social</text><text x="479" y="207">Afiliados</text></g>
