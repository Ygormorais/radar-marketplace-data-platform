name: radar

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      rpk topic create delivery-events-v1
      --brokers redpanda:9092
      --partitions 6
      --replicas 1
      --if-not-exists
      && rpk topic create clickstream-events-v1
      --brokers redpanda:9092
      --partitions 12
      --replicas 1
      --if-not-exists

  console:
    image: docker.redpanda.com/redpandadata/console:v3.1.3
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "18080:8080"

volumes:
  redpanda-data:
